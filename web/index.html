<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <title>Desk Buddy</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PHONE DESK BUDDY</p>
        <h1>Buddy</h1>
      </div>
      <div class="online-pill" id="serverStatus">
        <span class="status-dot"></span>
        <span>Waking up</span>
      </div>
    </header>

    <section class="buddy-zone" aria-label="Interactive Desk Buddy">
      <div class="ambient-orb orb-one"></div>
      <div class="ambient-orb orb-two"></div>

      <button class="buddy" id="buddy" type="button" aria-label="Boop Desk Buddy">
        <span class="ear ear-left"></span>
        <span class="ear ear-right"></span>

        <span class="face-screen">
          <span class="brow brow-left"></span>
          <span class="brow brow-right"></span>

          <span class="eye eye-left">
            <span class="pupil"></span>
            <span class="shine"></span>
          </span>
          <span class="eye eye-right">
            <span class="pupil"></span>
            <span class="shine"></span>
          </span>

          <span class="cheek cheek-left"></span>
          <span class="cheek cheek-right"></span>
          <span class="mouth"></span>
        </span>

        <span class="buddy-shadow"></span>
      </button>

      <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite">
        Hello. I have been assigned desk duty.
      </div>
    </section>

    <section class="info-grid" aria-label="Desk Buddy information">
      <article class="info-card weather-card">
        <div class="card-label">Weather</div>
        <div class="weather-main">
          <span class="weather-icon" id="weatherIcon">◌</span>
          <div>
            <strong id="weatherTemp">Location needed</strong>
            <span id="weatherText">Tap refresh and allow location</span>
          </div>
        </div>
        <button class="mini-button" id="weatherRefresh" type="button">Refresh</button>
      </article>

      <article class="info-card">
        <div class="card-label">Time</div>
        <strong class="big-value" id="clockValue">--:--</strong>
        <span class="sub-value" id="dateValue">Loading date</span>
      </article>

      <article class="info-card">
        <div class="card-label">Battery</div>
        <strong class="big-value" id="batteryValue">Checking</strong>
        <span class="sub-value" id="batteryText">Termux:API optional</span>
      </article>
    </section>

    <section class="controls" aria-label="Buddy controls">
      <button type="button" data-action="boop">Boop</button>
      <button type="button" data-action="cheer">Cheer</button>
      <button type="button" data-action="sleep">Sleep</button>
      <button type="button" data-action="talk">Talk</button>
      <button type="button" data-action="fullscreen">Full screen</button>
    </section>

    <footer>
      <span id="moodLabel">Mood: curious</span>
      <span>Local only</span>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
